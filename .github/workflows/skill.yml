name: skill
# The Agensi skill in skill/: witness v0.6 as one file. Separate from ci.yml, which gates witness itself.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: skill
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the bundle is built from, and tested against, the v0.6 tag
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: the shipped script is exactly v0.6 + the listed mechanical changes
        run: node build-skill.mjs --check
      - name: tests (receipt layer; v0.6's own suite against the one-file bundle; receipt and fuzz end to end)
        run: node --test kernel.test.mjs bundle.test.mjs
      - name: the committed mutation receipt is for this receipt layer and these tests
        run: node gate.mjs --verify
      - name: Agensi ZIP (package rules checked, SHA-256 printed)
        run: node make-zip.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: agensi-zip
          path: skill/dist/*.zip
  receipt-layer-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: witness v0.6 mutation gate on the receipt layer (every mutant)
        uses: sjgant80-hub/witness@v0.6
        with:
          files: skill/kernel.mjs
          test-command: node --test skill/kernel.test.mjs
          cap: 100000
          node-version: 20
