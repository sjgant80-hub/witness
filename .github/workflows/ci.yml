name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test

  # ⚑ THE INSTRUMENT WAS NOT GATED BY ITS OWN CI. `npm test` ran, and the Action was dogfooded
  # against a fixture, but witness.mjs itself never faced a mutation gate — the one file the whole
  # estate's trust rests on. It is slow (the suite spawns a child per mutant, and this gate spawns a
  # suite per mutant), and that is the price of the instrument being checkable at all.
  #
  # The bound is set explicitly and generously. The default is 20s; this suite does not finish in
  # 20s, and a suite slower than the bound makes every mutant time out and score a perfect clean.
  # witness now refuses that rather than reporting it, but the right bound still has to be given.
  self-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: witness gates itself
        run: node witness.mjs mutate witness.mjs --cap 400 --timeout 600000 --test node --test witness.test.mjs

      # runner.mjs enforces the bound and kills the tree. It is small, but it is the piece that
      # decides whether a run is counted KILLED — gating everything except the thing holding the
      # stopwatch would be the same "gate the edges" gap this job was added to close.
      - name: and gates its runner
        run: node witness.mjs mutate runner.mjs --cap 400 --timeout 600000 --test node --test witness.test.mjs

  action-dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Run witness's own composite Action against a known-good fixture: the boundary mutant must be
      # killed, so the gate is clean and this job passes. Proves the Action works end-to-end.
      - name: witness gate (self, via the Action)
        uses: ./
        with:
          files: fixtures/boundary.mjs
          test-command: node --test fixtures/boundary.good.test.mjs
