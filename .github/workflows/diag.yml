name: diag-wrapped-baseline
on: [push]
jobs:
  wrapped:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: replicate witness runSuiteOnce EXACTLY (the real baseline)
        if: always()
        run: node diag-runsuite.mjs
